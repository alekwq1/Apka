name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-apk:
    name: Build test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Run unit tests and build debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Prepare APK file
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/delivery-assistant-test-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.apk"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: delivery-assistant-apk-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct-download test release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="test-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          APK="dist/delivery-assistant-test-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.apk"
          gh release create "$TAG" "$APK" \
            --target "$GITHUB_SHA" \
            --title "FUJARA - test #${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --notes "Automatyczny testowy APK z GitHub Actions. Nie jest to wydanie produkcyjne." \
            --prerelease \
            --latest=false
