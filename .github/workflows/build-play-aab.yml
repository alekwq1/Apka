name: Build Google Play AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-play-aab:
    name: Signed release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.FUJARA_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FUJARA_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FUJARA_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FUJARA_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing FUJARA_UPLOAD_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing FUJARA_UPLOAD_STORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing FUJARA_UPLOAD_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing FUJARA_UPLOAD_KEY_PASSWORD" && exit 1)

      - name: Restore upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.FUJARA_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fujara-upload.jks"
          keytool -list -keystore "$RUNNER_TEMP/fujara-upload.jks" -storepass "${{ secrets.FUJARA_UPLOAD_STORE_PASSWORD }}" -alias "${{ secrets.FUJARA_UPLOAD_KEY_ALIAS }}" >/dev/null

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Run tests and build signed AAB
        env:
          FUJARA_UPLOAD_STORE_FILE: ${{ runner.temp }}/fujara-upload.jks
          FUJARA_UPLOAD_STORE_PASSWORD: ${{ secrets.FUJARA_UPLOAD_STORE_PASSWORD }}
          FUJARA_UPLOAD_KEY_ALIAS: ${{ secrets.FUJARA_UPLOAD_KEY_ALIAS }}
          FUJARA_UPLOAD_KEY_PASSWORD: ${{ secrets.FUJARA_UPLOAD_KEY_PASSWORD }}
        run: gradle --no-daemon testDebugUnitTest bundleRelease

      - name: Verify AAB exists
        run: test -f app/build/outputs/bundle/release/app-release.aab

      - name: Upload Play bundle
        uses: actions/upload-artifact@v7
        with:
          name: FUJARA-play-aab-${{ github.run_number }}-${{ github.run_attempt }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
